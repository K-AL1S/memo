<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务备忘录</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="memo-page" aria-label="任务备忘录">
    <header class="memo-header">
      <div>
        <p class="eyebrow">NO FORGET</p>
        <h1>我的任务</h1>
      </div>
      <div class="header-actions">
        <p class="header-note">先看已经写过的事项，再补充新的安排。</p>
        <a class="nav-button" href="completed.html">已完成</a>
      </div>
    </header>

    <section class="task-board" aria-labelledby="saved-title">
      <div class="section-heading">
        <h2 id="saved-title">已记录事项</h2>
        <span id="task-count">0 项</span>
      </div>
      <div class="task-list" id="task-list" aria-live="polite"></div>
      <p class="empty-state" id="empty-state">还没有记录事项，先在下面新增一个。</p>
    </section>

    <section class="new-task" aria-labelledby="new-title">
      <div class="section-heading">
        <h2 id="new-title">新增事项</h2>
        <span>New Task</span>
      </div>
      <form id="task-form">
        <label>
          <span>标题</span>
          <input id="task-title" type="text" required maxlength="40" placeholder="例如：整理项目资料">
        </label>
        <label>
          <span>具体信息</span>
          <textarea id="task-detail" required maxlength="240" placeholder="写清楚要做什么、需要注意什么。"></textarea>
        </label>
        <div class="form-row">
          <label>
            <span>截止日期</span>
            <input id="task-date" type="date" required>
          </label>
          <label>
            <span>截止时间</span>
            <input id="task-time" type="time" required>
          </label>
        </div>
        <label class="check-field">
          <input id="task-urgent" type="checkbox">
          <span>紧急</span>
        </label>
        <button type="submit">新增事项</button>
      </form>
    </section>
  </main>

  <template id="task-template">
    <article class="task-card">
      <div class="task-content">
        <div>
          <h3></h3>
          <p></p>
        </div>
        <label class="check-field task-urgent-field">
          <input class="urgent-input" type="checkbox">
          <span>紧急</span>
        </label>
      </div>
      <div class="task-meta">
        <label>
          <span>完成进度</span>
          <input class="progress-input" type="range" min="0" max="100" step="5">
        </label>
        <strong class="progress-value"></strong>
        <time></time>
        <em class="days-left"></em>
      </div>
    </article>
  </template>

  <script src="script.js"></script>
</body>
</html>
