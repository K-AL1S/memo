<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>备忘录</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="memo-page" aria-label="备忘录模板">
    <header class="memo-header">
      <div>
        <p class="eyebrow">MEMORANDUM</p>
        <h1 contenteditable="true">备忘录标题</h1>
      </div>
      <div class="memo-number">
        <span>编号</span>
        <strong contenteditable="true">M-0001</strong>
      </div>
    </header>

    <section class="meta-grid" aria-label="基础信息">
      <label>
        <span>日期</span>
        <input type="date" aria-label="日期">
      </label>
      <label>
        <span>负责人</span>
        <input type="text" aria-label="负责人" placeholder="请输入姓名">
      </label>
      <label>
        <span>事项类别</span>
        <input type="text" aria-label="事项类别" placeholder="例如：会议 / 项目 / 日常">
      </label>
      <label>
        <span>优先级</span>
        <select aria-label="优先级">
          <option>普通</option>
          <option>重要</option>
          <option>紧急</option>
        </select>
      </label>
    </section>

    <section class="memo-section">
      <div class="section-heading">
        <h2>重点提醒</h2>
        <span>Key Notes</span>
      </div>
      <textarea aria-label="重点提醒" placeholder="记录最需要关注的事项、时间节点或关键结论。"></textarea>
    </section>

    <section class="memo-section">
      <div class="section-heading">
        <h2>待办清单</h2>
        <span>To-do List</span>
      </div>
      <ul class="task-list" aria-label="待办清单">
        <li>
          <input type="checkbox" aria-label="待办事项一">
          <span contenteditable="true">待办事项一</span>
          <em contenteditable="true">截止日期</em>
        </li>
        <li>
          <input type="checkbox" aria-label="待办事项二">
          <span contenteditable="true">待办事项二</span>
          <em contenteditable="true">截止日期</em>
        </li>
        <li>
          <input type="checkbox" aria-label="待办事项三">
          <span contenteditable="true">待办事项三</span>
          <em contenteditable="true">截止日期</em>
        </li>
        <li>
          <input type="checkbox" aria-label="待办事项四">
          <span contenteditable="true">待办事项四</span>
          <em contenteditable="true">截止日期</em>
        </li>
      </ul>
    </section>

    <section class="memo-section">
      <div class="section-heading">
        <h2>详细备注</h2>
        <span>Details</span>
      </div>
      <textarea class="large-note" aria-label="详细备注" placeholder="补充背景信息、沟通记录、决定事项或后续安排。"></textarea>
    </section>

    <footer class="memo-footer">
      <label>
        <span>签名</span>
        <input type="text" aria-label="签名" placeholder="签名">
      </label>
      <label>
        <span>更新时间</span>
        <input type="text" aria-label="更新时间" placeholder="YYYY-MM-DD HH:MM">
      </label>
    </footer>
  </main>
</body>
</html>
